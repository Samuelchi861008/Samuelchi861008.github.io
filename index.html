  <!-- Font Awesome 6.5.1：只載入需要的子集（brands + regular），略過 solid/duotone 等未使用圖示集 -->

  <!-- Hero 個人照是 LCP 元素，提前 preload 加快首屏渲染 -->
  <link rel="preload" as="image" href="/img/main_img.JPG">
  <script type="module" crossorigin src="/assets/index-CU3u9l0_.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DSchWplM.css">
</head>
<body>
  <!--
    動態漸層背景層（固定定位，z-index: -1）
    包含四個模糊色塊（blob）做流動動畫，以及雜訊紋理（grain）
    這個 div 刻意放在 #app 外層，避免被 Vue 重新渲染影響效能
  -->
  <div id="gradient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="grain"></div>
  </div>

  <!-- Vue 3 掛載點：App.vue 的內容會渲染在此 div 內 -->
  <div id="app"></div>

  <!-- Vite 入口：type="module" 啟用 ES Module，開發時走 HMR，生產時走打包 -->
</body>
</html>
